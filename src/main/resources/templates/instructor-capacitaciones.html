<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modo == 'proximas'} ? 'Próximas capacitaciones' : 'Historial'">Capacitaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/instructores.css}">
    <style>
        .ic-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .ic-header-left { display: flex; align-items: center; gap: 14px; }
        .ic-header-icon {
            width: 46px; height: 46px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .ic-header-icon.proximas { background: #DBEAFE; }
        .ic-header-icon.proximas i { font-size: 22px; color: #2563EB; }
        .ic-header-icon.historial { background: #F3E8FF; }
        .ic-header-icon.historial i { font-size: 22px; color: #9333EA; }
        .ic-header h1 { font-size: 20px; font-weight: 700; color: var(--pc-texto); margin: 0; }
        .ic-header p { font-size: 13px; color: var(--pc-texto-suave); margin: 2px 0 0; }

        .ic-breadcrumb {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; color: var(--pc-texto-suave);
            margin-bottom: 14px;
        }
        .ic-breadcrumb a { color: #185FA5; text-decoration: none; font-size: 12px; }
        .ic-breadcrumb a:hover { text-decoration: underline; }
        .ic-breadcrumb i { font-size: 12px; }

        .ic-card {
            background: var(--pc-panel);
            border: 1px solid var(--pc-dorado-suave);
            border-radius: 10px;
            overflow: hidden;
        }
        .ic-card-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--pc-dorado-suave);
            background: #FAFAFA;
        }
        .ic-card-head h2 { font-size: 14px; font-weight: 700; color: var(--pc-texto); margin: 0; }
        .ic-count {
            font-size: 12px; font-weight: 600;
            background: var(--pc-fondo);
            color: var(--pc-texto-suave);
            border: 1px solid var(--pc-borde);
            border-radius: 20px;
            padding: 3px 12px;
        }

        .ic-table { width: 100%; border-collapse: collapse; }
        .ic-table th {
            text-align: left; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.3px;
            color: var(--pc-texto-suave); padding: 11px 16px;
            border-bottom: 1px solid var(--pc-dorado-suave);
            background: #FAFAFA;
        }
        .ic-table td {
            font-size: 13px; color: var(--pc-texto);
            padding: 12px 16px;
            border-bottom: 1px solid var(--pc-dorado-suave);
            vertical-align: middle;
        }
        .ic-table tr:last-child td { border-bottom: none; }
        .ic-table tr:hover td { background: #FAFAFA; }
        .ic-table-sub { font-size: 11px; color: var(--pc-texto-suave); display: block; margin-top: 2px; }

        .ic-pill {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 11px; font-weight: 600;
            padding: 3px 10px; border-radius: 20px;
        }
        .ic-pill::before {
            content: ''; width: 6px; height: 6px;
            border-radius: 50%; display: inline-block;
        }
       

        
        .ic-empty {
            text-align: center; padding: 40px 20px;
            color: var(--pc-texto-suave); font-size: 13px;
        }
        .ic-empty i { font-size: 36px; display: block; margin-bottom: 10px; opacity: 0.4; }

        .ic-btn-editar {
            width: 30px; height: 30px;
            border: 1px solid #BFDBFE; background: #EFF6FF;
            color: #2563EB; border-radius: 6px;
            display: inline-flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 14px;
            transition: background 0.15s;
        }
        .ic-btn-editar:hover { background: #DBEAFE; }

        .ic-instructor-card {
            background: var(--pc-panel);
            border: 1px solid var(--pc-dorado-suave);
            border-radius: 10px;
            padding: 16px 20px;
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 16px;
        }
        .ic-instructor-avatar {
            width: 46px; height: 46px; border-radius: 50%;
            background: #F3F4F6; color: var(--pc-texto-suave);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
        }
        .ic-instructor-nombre { font-size: 16px; font-weight: 700; color: var(--pc-texto); }
        .ic-instructor-tel { font-size: 13px; color: var(--pc-texto-suave); margin-top: 2px; }
        .ic-badge-estatus {
    font-size: 11px;
    font-weight: 600;
    background: #F3F4F6;
    color: #374151;
    border: 1px solid #E5E7EB;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">
        <button id="btnSidebar" class="btn-sidebar" type="button">☰</button>

        <!-- Breadcrumb -->
        <nav class="ic-breadcrumb">
            <a th:href="@{/instructores}">Instructores</a>
            <i class="ti ti-chevron-right"></i>
            <span th:text="${instructor.nombre}">Instructor</span>
            <i class="ti ti-chevron-right"></i>
            <span th:text="${modo == 'proximas'} ? 'Próximas capacitaciones' : 'Historial'">—</span>
        </nav>

        <!-- Page header -->
        <div class="ic-header">
            <div class="ic-header-left">
                <div class="ic-header-icon" th:class="${modo == 'proximas'} ? 'ic-header-icon proximas' : 'ic-header-icon historial'">
                    <i th:class="${modo == 'proximas'} ? 'ti ti-calendar-event' : 'ti ti-history'"></i>
                </div>
                <div>
                    <h1 th:text="${modo == 'proximas'} ? 'Próximas capacitaciones' : 'Historial de capacitaciones'">—</h1>
                    <p>
                        <span th:text="${instructor.nombre}">Instructor</span>
                        · <span th:text="${instructor.telefono}">Tel</span>
                    </p>
                </div>
            </div>
            <button type="button" class="ins-btn-primary"
             th:onclick="|window.location.href='@{/instructores}'|">
                <i class="ti ti-arrow-back-up"></i> Volver a instructores
            </button>
        </div>

        <!-- Tabla principal -->
        <div class="ic-card">
            <div class="ic-card-head">
                <h2 th:text="${modo == 'proximas'} ? 'Capacitaciones asignadas' : 'Capacitaciones realizadas'">—</h2>
                <span class="ic-count">
                    <span th:text="${#lists.size(capacitaciones)}">0</span> registros
                </span>
            </div>

            <div th:if="${#lists.isEmpty(capacitaciones)}" class="ic-empty">
                <i th:class="${modo == 'proximas'} ? 'ti ti-calendar-off' : 'ti ti-history'"></i>
                <span th:text="${modo == 'proximas'} ? 'No hay próximas capacitaciones asignadas.' : 'No hay capacitaciones en el historial.'">Sin registros</span>
            </div>

            <div th:if="${!#lists.isEmpty(capacitaciones)}" style="overflow-x:auto">
                <table class="ic-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Horario</th>
                            <th>Solicitante</th>
                            <th>Tipo de capacitación</th>
                            <th>Tipo de inmueble</th>
                            <th>Estatus</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cap : ${capacitaciones}">
                            <td th:text="${#temporals.format(cap.fecha, 'dd/MM/yyyy')}">—</td>
                            <td th:text="${#strings.substring(cap.horaInicio.toString(), 0, 5)} + ' - ' + ${#strings.substring(cap.horaFin.toString(), 0, 5)}">—</td>
                            <td>
                                <span th:text="${cap.nombreSolicitante}">—</span>
                                <span class="ic-table-sub" th:text="${cap.direccion}">—</span>
                            </td>
                            <td th:text="${cap.tipoCapacitacion.nombre}">—</td>
                           <td>
                                <span class="ic-pill"
                                 th:style="'background:' + ${coloresTipoInmueble[cap.tipoInmueble.nombre]} + '22; color:' + ${coloresTipoInmueble[cap.tipoInmueble.nombre]}">
                                <span th:style="'width:6px;height:6px;border-radius:50%;display:inline-block;background:' + ${coloresTipoInmueble[cap.tipoInmueble.nombre]}"></span>
                                <span th:text="${cap.tipoInmueble.nombre}">—</span>
                                </span>
                           </td>
                            <td>
                              <span class="ic-badge-estatus" th:text="${cap.estatus.nombre}">—</span>
                            </td>
                            <td>
                                <a th:href="@{/capacitaciones/editar/{id}(id=${cap.id})}" class="ic-btn-editar">
                                    <i class="ti ti-pencil"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
