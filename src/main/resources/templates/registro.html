<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <style>

        body{
            background: var(--pc-fondo);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .login-wrap{
            display:flex;
            width:930px;
            min-height:580px;
            border-radius:16px;
            overflow:hidden;
            box-shadow:0 20px 60px rgba(0,0,0,.15);
        }

        /* Panel izquierdo */

        .login-left{
            width:340px;
            background:linear-gradient(180deg,#8d0000b8,#020000);
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            padding:40px 30px;
        }

        .login-left img{
            width:140px;
            margin-bottom:25px;
        }

        .login-left h2{
            color:white;
            font-size:20px;
            font-weight:700;
            text-align:center;
            margin-bottom:10px;
        }

        .login-left p{
            color:rgba(255,255,255,.7);
            text-align:center;
            font-size:13px;
            line-height:1.6;
        }

        /* Panel derecho */

        .login-right{
            flex:1;
            background:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            padding:45px;
        }

        .login-right h1{
            font-size:26px;
            font-weight:700;
            color:var(--pc-texto);
            margin-bottom:5px;
        }

        .login-sub{
            color:var(--pc-texto-suave);
            margin-bottom:28px;
            font-size:13px;
        }

        .login-field{
            margin-bottom:18px;
        }

        .login-field label{
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--pc-texto);
            margin-bottom: 6px;
        }

        .login-input-wrap{
            position:relative;
        }

        .login-input-wrap i{
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: var(--pc-texto-suave);
        }

        .login-input-wrap input{
            width: 100%;
            border: 1px solid var(--pc-borde);
            border-radius: 8px;
            background-color: #ececec;
            padding: 11px 14px 11px 40px;
            font-size: 14px;
            color: var(--pc-texto);
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .login-input-wrap input:focus{
            outline: none;
            border-color: #8B0000;
            box-shadow: 0 0 0 3px rgba(139,0,0,0.10);
        }

        .login-btn{

           width: 100%;
            background: #8B0000;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

        }

        .login-btn:hover{

            background:#690000;

        }

        .login-link{

            margin-top:22px;
            text-align:center;
            font-size:13px;

        }

        .login-link a{

            color:#185FA5;
            text-decoration:none;
            font-weight:600;

        }

        .login-link a:hover{

            text-decoration:underline;

        }

        .login-alert{

            background:#FEF2F2;
            border:1px solid #FECACA;
            color:#991B1B;
            border-radius:8px;
            padding:10px 14px;
            margin-bottom:20px;
            font-size:13px;

        }

    </style>

</head>

<body>

<div class="login-wrap">

    <!-- Panel izquierdo -->

    <div class="login-left">

        <img th:src="@{/img/logo-pc.png}" alt="Logo">

        <h2>Crear una cuenta</h2>

        <p>
            Registra un nuevo usuario para acceder al sistema de
            Gestión de Actividades.
        </p>

    </div>

    <!-- Panel derecho -->

    <div class="login-right">

        <h1>Registro de usuario</h1>

        <p class="login-sub">
            Completa la siguiente información.
        </p>

       <div id="mensajeError"
              th:if="${error}"
              th:text="${error}"
              hidden>
       </div>

        <form th:action="@{/registro}" method="post" th:object="${usuario}">

            <div class="login-field">

                <label>Nombre completo</label>

                <div class="login-input-wrap">

                    <i class="ti ti-user-circle"></i>

                    <input
                            type="text"
                            th:field="*{nombre}"
                            placeholder="Nombre completo"
                            required>

                </div>

            </div>

            <div class="login-field">

                <label>Usuario</label>

                <div class="login-input-wrap">

                    <i class="ti ti-user"></i>

                    <input
                            type="text"
                            th:field="*{username}"
                            placeholder="Usuario"
                            required>

                </div>

            </div>

            <div class="login-field">

                <label>Contraseña</label>

                <div class="login-input-wrap">

                    <i class="ti ti-lock"></i>

                    <input
                            type="password"
                            th:field="*{password}"
                            placeholder="Contraseña"
                            required>

                </div>

            </div>

            <div class="login-field">

                <label>Confirmar contraseña</label>

                <div class="login-input-wrap">

                    <i class="ti ti-lock-check"></i>

                    <input
                            type="password"
                            name="confirmPassword"
                            placeholder="Confirmar contraseña"
                            required>

                </div>

            </div>

            <button class="login-btn">

                <i class="ti ti-user-plus"></i>

                Crear cuenta

            </button>

        </form>

        <div class="login-link">

            ¿Ya tienes una cuenta?

            <a th:href="@{/login}">
                Iniciar sesión
            </a>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
<script th:src="@{/js/registro.js}"></script>
</body>
</html>
