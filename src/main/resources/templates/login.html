<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <style>
        body {
            background: var(--pc-fondo);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-wrap {
            display: flex;
            width: 860px;
            min-height: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        /* Panel izquierdo — identidad visual */
        .login-left {
            width: 340px;
            background: linear-gradient(180deg, #8d0000b8, #020000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
            flex-shrink: 0;
        }
        .login-left img {
            width: 140px;
            margin-bottom: 24px;
        }
        .login-left h2 {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-left p {
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }
        .login-left p2 {
            color: #c6c6c4;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
        }
        /* Panel derecho — formulario */
        .login-right {
            flex: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 44px;
        }
        .login-right h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--pc-texto);
            margin-bottom: 6px;
        }
        .login-right .login-sub {
            font-size: 13px;
            color: var(--pc-texto-suave);
            margin-bottom: 30px;
        }
        .login-field { margin-bottom: 18px; }
        .login-field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--pc-texto);
            margin-bottom: 6px;
        }
        .login-input-wrap { position: relative; }
        .login-input-wrap i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: var(--pc-texto-suave);
        }
        .login-input-wrap input {
            width: 100%;
            border: 1px solid var(--pc-borde);
            border-radius: 8px;
            background-color: #ececec;
            padding: 11px 14px 11px 40px;
            font-size: 14px;
            color: var(--pc-texto);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .login-input-wrap input:focus {
            outline: none;
            border-color: #8B0000;
            box-shadow: 0 0 0 3px rgba(139,0,0,0.10);
        }
        .login-btn {
            width: 100%;
            background: #8B0000;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .login-btn:hover { background: #650000; }
        .login-alert {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #991B1B;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .login-alert-success {
            background: #DCFCE7;
            border-color: #BBF7D0;
            color: #166534;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--pc-texto-suave);
        }
        .login-link a {
            color: #185FA5;
            font-weight: 600;
            text-decoration: none;
        }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="login-wrap">

    <!-- Panel izquierdo -->
    <div class="login-left">
        <p2>Coordinación de Capacitación, Vinculación y Difusión.</p2>
        <img th:src="@{/img/logo-pc.png}" alt="Logo Protección Civil">
        <h2>Gestión de Actividades</h2>
        <p>Sistema interno de administración.</p>
    </div>

    <!-- Panel derecho -->
    <div class="login-right">
        <h1>Bienvenido</h1>
        <p class="login-sub">Inicia sesión para acceder al sistema.</p>

        <!-- Error de credenciales -->

        <form th:action="@{/login}" method="post">
            <div class="login-field">
                <label for="username">Usuario</label>
                <div class="login-input-wrap">
                    <i class="ti ti-user"></i>
                    <input type="text" id="username" name="username"
                           placeholder="Ingresa tu usuario" required autofocus>
                </div>
            </div>
            <div class="login-field">
                <label for="password">Contraseña</label>
                <div class="login-input-wrap">
                    <i class="ti ti-lock"></i>
                    <input type="password" id="password" name="password"
                           placeholder="Ingresa tu contraseña" required>
                </div>
            </div>
            <button type="submit" class="login-btn">
                <i class="ti ti-login"></i> Iniciar sesión
            </button>
        </form>

        <div class="login-link">
            ¿No tienes cuenta? <a th:href="@{/registro}">Crear cuenta</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
